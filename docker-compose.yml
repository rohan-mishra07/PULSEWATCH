
services:
  postgres:
    image: postgres:17
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev
      POSTGRES_DB: pulsewatch_db
    ports:
      - "5432:5432"
    volumes:
      - pulsewatch_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulsewatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pulsewatch_data:
